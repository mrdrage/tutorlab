name: Year-1 generation coverage

on:
  pull_request:
    paths:
      - 'engine/**'
      - 'curriculum/middle-school/mathematics/year-1.json'
      - 'curriculum/middle-school/english/year-1.json'
      - 'tools/check_year1_generation_coverage.py'
      - 'tests/generation-year1/**'
      - '.github/workflows/year1-generation-validation.yml'
  push:
    branches: [main]
    paths:
      - 'engine/**'
      - 'curriculum/middle-school/mathematics/year-1.json'
      - 'curriculum/middle-school/english/year-1.json'
      - 'tools/check_year1_generation_coverage.py'
      - 'tests/generation-year1/**'

jobs:
  validate-year1-generation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Validate complete first-year generation coverage
        run: python3 tools/check_year1_generation_coverage.py
