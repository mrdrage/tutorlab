name: Session engine validation

on:
  pull_request:
    paths:
      - 'engine/**'
      - 'config/session-policy.json'
      - 'schemas/session-*.schema.json'
      - 'tests/session/**'
      - 'examples/session/**'
      - 'tools/check_session_engine.py'
      - '.github/workflows/session-validation.yml'
  push:
    branches: [main]
    paths:
      - 'engine/**'
      - 'config/session-policy.json'
      - 'schemas/session-*.schema.json'
      - 'tests/session/**'
      - 'examples/session/**'
      - 'tools/check_session_engine.py'

jobs:
  validate-session-engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Validate session engine
        run: python3 tools/check_session_engine.py
      - name: Run vertical slices
        run: python3 examples/session/vertical_slices.py > /tmp/tutorlab-vertical-slices.json
