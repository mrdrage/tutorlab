name: Year-2 generation coverage

on:
  pull_request:
    paths:
      - 'engine/**'
      - 'curriculum/middle-school/mathematics/year-2.json'
      - 'curriculum/middle-school/english/year-2.json'
      - 'tools/check_year2_generation_coverage.py'
      - '.github/workflows/year2-generation-validation.yml'
  push:
    branches: [main]
    paths:
      - 'engine/**'
      - 'curriculum/middle-school/mathematics/year-2.json'
      - 'curriculum/middle-school/english/year-2.json'
      - 'tools/check_year2_generation_coverage.py'

jobs:
  validate-year2-generation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Validate complete second-year generation coverage
        run: python3 tools/check_year2_generation_coverage.py
