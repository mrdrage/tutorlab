name: Learning snapshot validation

on:
  pull_request:
    paths:
      - 'engine/**'
      - 'schemas/learning-snapshot.schema.json'
      - 'examples/learning_snapshot/**'
      - 'tests/learning-snapshot/**'
      - 'tools/check_learning_snapshot.py'
      - '.github/workflows/learning-snapshot-validation.yml'
  push:
    branches: [main]
    paths:
      - 'engine/**'
      - 'schemas/learning-snapshot.schema.json'
      - 'examples/learning_snapshot/**'
      - 'tests/learning-snapshot/**'
      - 'tools/check_learning_snapshot.py'

jobs:
  validate-learning-snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Validate learning snapshot flow
        run: python3 tools/check_learning_snapshot.py
